name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools for firmware compile checks
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest
      - name: Horizon A host verify
        run: python3 scripts/horizon_a_verify.py --write-firmware --require-toolchain

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: vitest
        run: npm test
