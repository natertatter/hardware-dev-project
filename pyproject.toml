[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eda-platform"
version = "0.1.0"
description = "Intelligent EDA and firmware code-generation platform for robotics hardware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eda_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
