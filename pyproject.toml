[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eda-platform"
version = "0.1.0"
description = "Intelligent EDA and firmware code-generation platform for robotics hardware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[project.scripts]
eda-api = "eda_platform.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eda_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
